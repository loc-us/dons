<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculatrice de dons — don personnel (IR ou IFI) ou don par une entreprise (mécénat).">
  <title>Calculatrice de dons</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a1f14;
      --bg-card: #122a1c;
      --green-bright: #00c853;
      --green-mid: #4caf50;
      --green-soft: #a5d6a7;
      --text-primary: #e8f5e9;
      --text-muted: #81c784;
      --border: rgba(0, 200, 83, 0.25);
      --border-strong: rgba(0, 200, 83, 0.5);
      --alert-bg: rgba(255, 193, 7, 0.12);
      --alert-text: #ffe082;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(0, 200, 83, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(76, 175, 80, 0.08) 0%, transparent 50%),
        var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.5;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 800;
      color: var(--text-primary);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .mode-tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      padding: 0.2rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .mode-tab {
      flex: 1;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .mode-tab:hover {
      color: var(--text-primary);
    }

    .mode-tab.active {
      color: var(--bg-dark);
      background: var(--green-mid);
    }

    .tab {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: calc(var(--radius) - 4px);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab:hover {
      color: var(--text-primary);
      background: rgba(0, 200, 83, 0.08);
    }

    .tab.active {
      color: var(--bg-dark);
      background: var(--green-bright);
    }

    .tab:focus-visible {
      outline: 2px solid var(--green-bright);
      outline-offset: 2px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .card {
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .field {
      display: block;
      margin-bottom: 1.25rem;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field.hidden {
      display: none;
    }

    .field-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .optional {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .field-hint {
      display: block;
      margin: -0.25rem 0 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .field-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .field-checkbox input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      margin-top: 0.15rem;
      accent-color: var(--green-bright);
      cursor: pointer;
      flex-shrink: 0;
    }

    .field-checkbox-hint {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .input-wrap:focus-within {
      border-color: var(--green-bright);
    }

    .input-wrap input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1.1rem;
      color: var(--text-primary);
      background: transparent;
      border: none;
      outline: none;
      min-width: 0;
    }

    .input-wrap input::placeholder {
      color: rgba(165, 214, 167, 0.4);
    }

    /* Masque les flèches natives des champs number (non stylisables de façon fiable) */
    .input-wrap input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .input-wrap input[type="number"]::-webkit-outer-spin-button,
    .input-wrap input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .input-suffix {
      padding: 0 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--green-mid);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .field select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: var(--text-primary);
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      outline: none;
    }

    .field select:focus {
      border-color: var(--green-bright);
    }

    .results {
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .flow {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .flow-step {
      padding: 1rem 1.25rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .flow-step--result {
      background: rgba(0, 200, 83, 0.12);
      border-color: var(--border-strong);
      text-align: center;
      padding: 1.25rem;
    }

    .flow-step--input {
      border-color: rgba(0, 200, 83, 0.35);
    }

    .flow-step--middle {
      border-style: dashed;
    }

    .flow-step--excess {
      border-style: dashed;
      border-color: rgba(255, 193, 7, 0.45);
      background: var(--alert-bg);
    }

    .flow-step--excess .flow-step-label,
    .flow-step--excess .flow-step-value,
    .flow-step--excess .flow-step-note {
      color: var(--alert-text);
    }

    .flow-step-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
    }

    .flow-step--result .flow-step-label {
      color: var(--green-mid);
    }

    .flow-step-value {
      display: block;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .flow-step--result .flow-step-value {
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      color: var(--green-bright);
    }

    .flow-step-note {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .flow-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0 0.25rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .flow-divider::before,
    .flow-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .flow-bridge {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 0;
      color: var(--text-muted);
    }

    .flow-bridge-line {
      width: 2px;
      height: 12px;
      background: var(--border-strong);
    }

    .flow-bridge-op {
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      padding: 0.35rem 0.75rem;
      background: rgba(0, 200, 83, 0.06);
      border: 1px dashed var(--border);
      border-radius: 999px;
      color: var(--green-soft);
      max-width: 100%;
    }

    .flow-bridge--line-only {
      padding: 0.35rem 0;
    }

    .flow-bridge--line-only .flow-bridge-line {
      height: 16px;
    }

    .flow-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .alert {
      margin: 1rem 0 0;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: var(--alert-text);
      background: var(--alert-bg);
      border: 1px solid rgba(255, 193, 7, 0.3);
      border-radius: 8px;
    }

    .alert.hidden {
      display: none;
    }

    .footer {
      margin-top: 2.5rem;
      text-align: center;
    }

    .disclaimer {
      margin: 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem 1rem 2.5rem;
      }

      .field-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Calculatrice de dons</h1>
    </header>

    <nav class="tabs" role="tablist" aria-label="Type de don : personnel ou entreprise">
      <button type="button" class="tab active" role="tab" aria-selected="true" aria-controls="panel-particulier" id="tab-particulier" data-tab="particulier">
        Don personnel
      </button>
      <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="panel-mecenat" id="tab-mecenat" data-tab="mecenat">
        Mécénat d'entreprise
      </button>
    </nav>

    <main>
      <section id="panel-particulier" class="panel active" role="tabpanel" aria-labelledby="tab-particulier">
        <div class="card">
          <div class="mode-tabs" role="tablist" aria-label="Mode de calcul particulier">
            <button type="button" class="mode-tab active" data-mode="poche" data-panel="particulier">De ma poche</button>
            <button type="button" class="mode-tab" data-mode="don" data-panel="particulier">Montant du don</button>
          </div>

          <label class="field" for="particulier-montant">
            <span class="field-label" id="particulier-montant-label">Combien voulez-vous mettre de votre poche ?</span>
            <div class="input-wrap">
              <input type="number" id="particulier-montant" min="0" step="1" placeholder="50 €" inputmode="decimal">
              <span class="input-suffix">€</span>
            </div>
          </label>

          <label class="field-checkbox" for="particulier-redevable-ifi">
            <input type="checkbox" id="particulier-redevable-ifi">
            <span>Je suis redevable de l'IFI</span>
          </label>

          <label class="field" for="particulier-revenu" id="particulier-revenu-field">
            <span class="field-label" id="particulier-revenu-label">Revenu imposable annuel <span class="optional">(optionnel, pour le plafond)</span></span>
            <div class="input-wrap">
              <input type="number" id="particulier-revenu" min="0" step="1000" placeholder="25 000" inputmode="decimal">
              <span class="input-suffix">€</span>
            </div>
          </label>

          <label class="field hidden" for="particulier-ifi" id="particulier-ifi-field">
            <span class="field-label">IFI dû <span class="optional">(optionnel, plafond IFI)</span></span>
            <div class="input-wrap">
              <input type="number" id="particulier-ifi" min="0" step="1000" placeholder="1 000" inputmode="decimal">
              <span class="input-suffix">€</span>
            </div>
          </label>
        </div>

        <div class="results" id="particulier-results" aria-live="polite">
          <div class="flow" id="particulier-flow">
            <div class="flow-empty">Saisissez un montant pour voir le calcul</div>
          </div>
          <p class="alert hidden" id="particulier-alert" role="status"></p>
        </div>
      </section>

      <section id="panel-mecenat" class="panel" role="tabpanel" aria-labelledby="tab-mecenat" hidden>
        <div class="card">
          <div class="mode-tabs" role="tablist" aria-label="Mode de calcul — don de l'entreprise">
            <button type="button" class="mode-tab active" data-mode="poche" data-panel="mecenat">De ma poche</button>
            <button type="button" class="mode-tab" data-mode="don" data-panel="mecenat">Montant du don</button>
          </div>

          <label class="field" for="mecenat-montant">
            <span class="field-label" id="mecenat-montant-label">Combien voulez-vous mettre de votre poche ?</span>
            <span class="field-hint" id="mecenat-montant-hint" hidden></span>
            <div class="input-wrap">
              <input type="number" id="mecenat-montant" min="0" step="1" placeholder="100 €" inputmode="decimal">
              <span class="input-suffix">€</span>
            </div>
          </label>

          <label class="field" for="mecenat-ca">
            <span class="field-label">Chiffre d'affaires HT de l'entreprise <span class="optional">(plafond du don)</span></span>
            <div class="input-wrap">
              <input type="number" id="mecenat-ca" min="0" step="10000" placeholder="50 000" inputmode="decimal">
              <span class="input-suffix">€</span>
            </div>
          </label>
        </div>

        <div class="results" id="mecenat-results" aria-live="polite">
          <div class="flow" id="mecenat-flow">
            <div class="flow-empty">Saisissez un montant pour voir le calcul</div>
          </div>
          <p class="alert hidden" id="mecenat-alert" role="status"></p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="disclaimer">
        Outil indicatif, ne constitue pas un conseil fiscal. Vérifiez avec votre expert-comptable.
      </p>
    </footer>
  </div>

  <script>
    'use strict';

    const TAUX_REDUCTION_IR = 0.66;
    const TAUX_REDUCTION_IFI = 0.75;
    const TAUX_REDUCTION_IS = 0.60;
    const TAUX_PFU = 0.314;
    const PLAFOND_IR_REVENU = 0.20;
    const PLAFOND_IFI_REDUCTION = 50000;
    const PLAFOND_IFI_DON = PLAFOND_IFI_REDUCTION / TAUX_REDUCTION_IFI;
    const PLAFOND_MECENAT_MIN = 20000;
    const PLAFOND_MECENAT_CA = 0.005;

    // Tolérance en euros pour les comparaisons de plafonds.
    const EPS = 0.005;

    const modeParticulier = { current: 'poche' };
    const modeMecenat = { current: 'poche' };

    const LABELS = {
      particulier: {
        poche: { label: 'Combien voulez-vous mettre de votre poche ?', placeholder: '50 €' },
        don: { label: 'Quel montant souhaitez-vous donner ?', placeholder: '50 €' },
      },
      mecenat: {
        poche: {
          label: 'Combien voulez-vous que ce don vous coûte personnellement ?',
          hint: 'L\'entreprise verse le don ; équivalent net pour vous (après PFU sur dividendes)',
          placeholder: '100 €',
        },
        don: {
          label: 'Quel montant l\'entreprise veut-elle donner ?',
          hint: null,
          placeholder: '100 €',
        },
      },
    };

    function formatEuro(amount) {
      if (amount == null || Number.isNaN(amount)) return '—';
      return new Intl.NumberFormat('fr-FR', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(amount);
    }

    function parseInput(value) {
      if (value === '' || value == null) return null;
      const n = Number(value);
      return Number.isFinite(n) && n >= 0 ? n : null;
    }

    /*
     * Moteur de calcul.
     *
     * Tout repose sur une seule abstraction, le « dispositif » : un taux de
     * réduction et l'assiette maximale de don qui y ouvre droit. Au-delà de
     * cette assiette, l'euro donné n'est plus réduit (reportable sur 5 ans
     * pour l'IR et l'IS, définitivement perdu pour l'IFI).
     *
     *   - IR  (art. 200)  : 66 %, assiette plafonnée à 20 % du revenu imposable
     *   - IFI (art. 978)  : 75 %, assiette plafonnée à 66 667 € (réduction max.
     *                       50 000 €) et à l'IFI réellement dû
     *   - IS  (mécénat)   : 60 %, assiette plafonnée à max(20 000 €, 0,5 % CA HT)
     */

    function dispositifIr(revenuImposable) {
      // Champ vide : plafond IR inconnu. Zéro explicite : aucune réduction IR possible.
      const assietteMax = revenuImposable == null
        ? Infinity
        : revenuImposable * PLAFOND_IR_REVENU;
      return { id: 'ir', taux: TAUX_REDUCTION_IR, assietteMax };
    }

    function dispositifIfi(ifiDu) {
      // Champ vide : seul le plafond légal s'applique. Zéro explicite : pas d'IFI dû.
      const assietteIfiDu = ifiDu == null ? Infinity : ifiDu / TAUX_REDUCTION_IFI;
      const assietteMax = Math.min(PLAFOND_IFI_DON, assietteIfiDu);
      return {
        id: 'ifi',
        taux: TAUX_REDUCTION_IFI,
        assietteMax,
        motif: ifiDu != null && assietteIfiDu < PLAFOND_IFI_DON - EPS ? 'ifiDu' : 'plafond',
        ifiDu,
      };
    }

    function dispositifIs(caHT) {
      const assietteMax = caHT != null && caHT > 0
        ? Math.max(PLAFOND_MECENAT_MIN, caHT * PLAFOND_MECENAT_CA)
        : PLAFOND_MECENAT_MIN;
      return { id: 'is', taux: TAUX_REDUCTION_IS, assietteMax };
    }

    function reductionPour(dispositif, don) {
      return Math.min(don, dispositif.assietteMax) * dispositif.taux;
    }

    // Coût net d'un don qui sature exactement l'assiette du dispositif.
    function coutNetAssietteMax(dispositif) {
      return dispositif.assietteMax * (1 - dispositif.taux);
    }

    // Une assiette est « saturée » soit parce que le don la dépasse, soit parce
    // qu'elle a forcé le report du reliquat sur un dispositif moins avantageux.
    function marquerSaturation(parts) {
      parts.forEach((part, index) => {
        if (!Number.isFinite(part.dispositif.assietteMax)) {
          part.assietteSaturee = false;
          return;
        }
        const reliquatReporte = parts.slice(index + 1).some((autre) => autre.don > EPS);
        part.assietteSaturee =
          part.don > part.dispositif.assietteMax + EPS ||
          (reliquatReporte && part.don >= part.dispositif.assietteMax - EPS);
      });
      return parts;
    }

    // Répartit un don connu entre les dispositifs, du plus avantageux au moins
    // avantageux. Le dernier absorbe l'excédent, réduit ou non.
    function repartirDepuisDon(dispositifs, montantDon) {
      let reste = montantDon;
      const parts = dispositifs.map((dispositif, index) => {
        const dernier = index === dispositifs.length - 1;
        const don = dernier ? reste : Math.min(reste, dispositif.assietteMax);
        reste -= don;
        return { dispositif, don, reduction: reductionPour(dispositif, don) };
      });
      return marquerSaturation(parts);
    }

    // Remonte du coût net souhaité vers le don, en saturant chaque dispositif
    // avant de passer au suivant.
    function repartirDepuisPoche(dispositifs, coutNetSouhaite) {
      let reste = coutNetSouhaite;
      const parts = dispositifs.map((dispositif, index) => {
        const dernier = index === dispositifs.length - 1;
        const coutSature = coutNetAssietteMax(dispositif);
        let don;

        if (reste <= EPS) {
          don = 0;
        } else if (reste <= coutSature + EPS) {
          don = reste / (1 - dispositif.taux);
          reste = 0;
        } else if (dernier) {
          // Au-delà de l'assiette, chaque euro donné coûte un euro.
          don = dispositif.assietteMax + (reste - coutSature);
          reste = 0;
        } else {
          don = dispositif.assietteMax;
          reste -= coutSature;
        }

        return { dispositif, don, reduction: reductionPour(dispositif, don) };
      });
      return marquerSaturation(parts);
    }

    function messagePourPart(part) {
      if (!part.assietteSaturee) {
        return null;
      }

      const { dispositif } = part;

      if (dispositif.id === 'ifi' && dispositif.motif === 'ifiDu') {
        return `Votre IFI dû (${formatEuro(dispositif.ifiDu)}) limite la réduction IFI. ` +
          `Le reliquat du don est imputé sur l'IR (${formatPct(TAUX_REDUCTION_IR)}) ; ` +
          `un excédent d'IFI ne serait pas reportable.`;
      }

      if (dispositif.id === 'ifi') {
        return `Plafond IFI atteint : ${formatEuro(PLAFOND_IFI_DON)} de don au maximum ` +
          `(réduction plafonnée à ${formatEuro(PLAFOND_IFI_REDUCTION)}). ` +
          `Le reliquat est imputé sur l'IR (${formatPct(TAUX_REDUCTION_IR)}).`;
      }

      if (dispositif.id === 'ir') {
        return `Seuls ${formatEuro(dispositif.assietteMax)} de don ouvrent droit à la réduction IR ` +
          `cette année (20 % du revenu imposable). L'excédent est reportable sur 5 ans.`;
      }

      return `Seuls ${formatEuro(dispositif.assietteMax)} du don de l'entreprise ouvrent droit à la ` +
        `réduction cette année (max(20 000 €, 0,5 % du CA HT)). L'excédent est reportable sur 5 ans.`;
    }

    function totalParts(parts, cle) {
      return parts.reduce((total, part) => total + part[cle], 0);
    }

    // Fraction du don qui dépasse l'assiette et n'ouvre donc droit à aucune
    // réduction cette année. Seul le dernier dispositif peut en générer, les
    // précédents reportant leur reliquat sur le suivant.
    function excedentPour(part) {
      if (!Number.isFinite(part.dispositif.assietteMax)) {
        return 0;
      }
      return Math.max(0, part.don - part.dispositif.assietteMax);
    }

    function assemblerResultatParticulier(parts, regime) {
      const montantDon = totalParts(parts, 'don');
      const reductionFiscale = totalParts(parts, 'reduction');
      const messages = parts.map(messagePourPart).filter(Boolean);
      const partIfi = parts.find((part) => part.dispositif.id === 'ifi');
      const partIr = parts.find((part) => part.dispositif.id === 'ir');
      const excedent = parts.reduce((total, part) => total + excedentPour(part), 0);
      const assietteIr = partIr
        ? Math.min(partIr.don, partIr.dispositif.assietteMax)
        : 0;

      return {
        regime,
        montantDon,
        montantRecuAssociation: montantDon,
        reductionFiscale,
        coutReel: montantDon - reductionFiscale,
        donIfi: partIfi ? partIfi.don : 0,
        donIr: partIr ? partIr.don : 0,
        reductionIfi: partIfi ? partIfi.reduction : 0,
        reductionIr: partIr ? partIr.reduction : 0,
        excedent,
        assietteIr,
        panachage: Boolean(partIfi && partIr && partIfi.don > EPS && partIr.don > EPS),
        motifIfi: partIfi && partIfi.assietteSaturee ? partIfi.dispositif.motif : null,
        plafondAtteint: messages.length > 0,
        messagePlafond: messages.length ? messages.join(' ') : null,
      };
    }

    function calculDonParticulier(montant, revenuImposable, ifiDu, mode, regime) {
      if (montant == null || montant <= 0) {
        return null;
      }

      // Ordre décroissant de taux : on sature l'IFI (75 %) avant l'IR (66 %).
      const dispositifs = regime === 'ifi'
        ? [dispositifIfi(ifiDu), dispositifIr(revenuImposable)]
        : [dispositifIr(revenuImposable)];

      const parts = mode === 'don'
        ? repartirDepuisDon(dispositifs, montant)
        : repartirDepuisPoche(dispositifs, montant);

      return assemblerResultatParticulier(parts, regime);
    }

    function calculMecenat(montant, caHT, mode) {
      if (montant == null || montant <= 0) {
        return null;
      }

      const dispositif = dispositifIs(caHT);
      // En mode poche, on remonte d'abord du net perçu après PFU vers le coût
      // pour la société (l'équivalent dividendes), puis de ce coût vers le don.
      const cible = mode === 'don' ? montant : montant / (1 - TAUX_PFU);
      const [part] = mode === 'don'
        ? repartirDepuisDon([dispositif], cible)
        : repartirDepuisPoche([dispositif], cible);

      const coutSociete = part.don - part.reduction;
      const message = messagePourPart(part);

      return {
        montantDon: part.don,
        montantRecuAssociation: part.don,
        reductionFiscale: part.reduction,
        coutSociete,
        coutPoche: coutSociete * (1 - TAUX_PFU),
        excedent: excedentPour(part),
        assietteRetenue: Math.min(part.don, dispositif.assietteMax),
        plafondAtteint: Boolean(message),
        messagePlafond: message,
        plafond: dispositif.assietteMax,
      };
    }

    function libellePartieIfi(result) {
      if (result.motifIfi === 'plafond') {
        return {
          label: 'Partie IFI (plafond)',
          note: `Maximum imputable en IFI : ${formatEuro(PLAFOND_IFI_DON)}`,
        };
      }
      if (result.motifIfi === 'ifiDu') {
        return {
          label: 'Partie IFI',
          note: `Réduction limitée à ${formatEuro(result.reductionIfi)} (votre IFI dû)`,
        };
      }
      return { label: 'Partie IFI', note: '' };
    }

    function formatPct(rate) {
      return new Intl.NumberFormat('fr-FR', {
        style: 'percent',
        minimumFractionDigits: 0,
        maximumFractionDigits: 1,
      }).format(rate);
    }

    // Taux toujours affiché, montant effectif entre parenthèses.
    function labelReduction(label, taux, montant) {
      return `Réduction ${label} de ${formatPct(taux)} (${formatEuro(montant)})`;
    }

    function flowDivider(label = 'Détail du calcul') {
      return `<div class="flow-divider"><span>${label}</span></div>`;
    }

    function flowBridgeForward(op) {
      return `
        <div class="flow-bridge">
          <div class="flow-bridge-line"></div>
          <span class="flow-bridge-op">${op}</span>
          <div class="flow-bridge-line"></div>
        </div>`;
    }

    function flowConnector() {
      return `
        <div class="flow-bridge flow-bridge--line-only" aria-hidden="true">
          <div class="flow-bridge-line"></div>
        </div>`;
    }

    // Insère un trait entre deux cases consécutives. Les ponts (bulles de
    // réduction) ont déjà leurs propres traits haut/bas : pas de doublon.
    function assembleFlow(blocks) {
      const out = [];
      let prevWasStep = false;

      for (const block of blocks) {
        if (!block) continue;

        const isStep = block.includes('flow-step');
        const isDivider = block.includes('flow-divider');

        if (isStep && prevWasStep) {
          out.push(flowConnector());
        }

        out.push(block);

        if (isDivider) {
          prevWasStep = false;
        } else if (isStep) {
          prevWasStep = true;
        } else {
          prevWasStep = false;
        }
      }

      return out.join('');
    }

    function flowStep(label, value, note, variant) {
      return `
        <div class="flow-step flow-step--${variant}">
          <span class="flow-step-label">${label}</span>
          <span class="flow-step-value">${value}</span>
          ${note ? `<span class="flow-step-note">${note}</span>` : ''}
        </div>`;
    }

    function stepExcedent(montant, note) {
      return flowStep('Excédent non réduit', formatEuro(montant), note, 'excess');
    }

    function renderParticulierFlow(result, mode) {
      const container = document.getElementById('particulier-flow');
      if (!result) {
        container.innerHTML = '<div class="flow-empty">Saisissez un montant pour voir le calcul</div>';
        return;
      }

      const isPoche = mode === 'poche';
      const isIfi = result.regime === 'ifi';
      const excedent = result.excedent > EPS ? result.excedent : 0;
      const noteExcedent = 'Au-delà de 20 % du revenu imposable — aucune réduction cette année, reportable sur 5 ans';

      const stepResult = flowStep(
        isPoche ? 'Don à effectuer' : 'Votre poche',
        formatEuro(isPoche ? result.montantDon : result.coutReel),
        isPoche ? 'Montant total du don' : 'Ce que ça vous coûte réellement',
        'result'
      );
      const stepInput = flowStep(
        isPoche ? 'Votre poche' : 'Don à effectuer',
        formatEuro(isPoche ? result.coutReel : result.montantDon),
        'Montant saisi',
        'input'
      );

      let detail;

      if (result.panachage) {
        const ifiPart = libellePartieIfi(result);
        detail = [
          flowStep(ifiPart.label, formatEuro(result.donIfi), ifiPart.note, 'middle'),
          flowBridgeForward(
            labelReduction('IFI', TAUX_REDUCTION_IFI, result.reductionIfi)
          ),
          flowStep(
            excedent ? 'Partie IR (dans le plafond)' : 'Partie IR (reliquat)',
            formatEuro(excedent ? result.assietteIr : result.donIr),
            excedent
              ? 'Plafonnée à 20 % du revenu imposable'
              : 'Ce qu\'il reste à imputer sur l\'impôt sur le revenu',
            'middle'
          ),
          flowBridgeForward(
            labelReduction('IR', TAUX_REDUCTION_IR, result.reductionIr)
          ),
          excedent ? stepExcedent(excedent, noteExcedent) : null,
        ].filter(Boolean);
      } else {
        const taux = isIfi ? TAUX_REDUCTION_IFI : TAUX_REDUCTION_IR;
        const bridgeLabel = isIfi ? 'IFI' : 'IR';
        detail = [
          flowBridgeForward(
            labelReduction(bridgeLabel, taux, result.reductionFiscale)
          ),
          excedent
            ? flowStep(
              'Dans le plafond',
              formatEuro(result.assietteIr),
              `Seule cette part ouvre droit à la réduction de ${formatPct(taux)}`,
              'middle'
            )
            : null,
          excedent ? stepExcedent(excedent, noteExcedent) : null,
        ].filter(Boolean);
      }

      container.innerHTML = assembleFlow([stepResult, flowDivider(), ...detail, stepInput]);
    }

    function renderMecenatFlow(result, mode) {
      const container = document.getElementById('mecenat-flow');
      if (!result) {
        container.innerHTML = '<div class="flow-empty">Saisissez un montant pour voir le calcul</div>';
        return;
      }

      const isPoche = mode === 'poche';
      const excedent = result.excedent > EPS ? result.excedent : 0;

      const stepResult = flowStep(
        isPoche ? 'Don de l\'entreprise' : 'Votre poche',
        formatEuro(isPoche ? result.montantDon : result.coutPoche),
        isPoche ? 'Montant total du don' : 'Net après réduction d\'impôt et PFU',
        'result'
      );
      const stepInput = flowStep(
        isPoche ? 'Votre poche' : 'Don de l\'entreprise',
        formatEuro(isPoche ? result.coutPoche : result.montantDon),
        'Montant saisi',
        'input'
      );
      const bridgePfu = flowBridgeForward(
        isPoche
          ? `PFU de ${formatPct(TAUX_PFU)}`
          : `Équivalent brut avant PFU (${formatPct(TAUX_PFU)})`
      );
      const bridgeIs = flowBridgeForward(
        labelReduction('d\'IS', TAUX_REDUCTION_IS, result.reductionFiscale)
      );
      const stepDiv = flowStep(
        'Équivalent dividendes',
        formatEuro(result.coutSociete),
        'Ce que l\'entreprise aurait pu vous verser à la place du don',
        'middle'
      );
      const stepPlafond = excedent
        ? flowStep(
          'Dans le plafond',
          formatEuro(result.assietteRetenue),
          `max(20 000 €, 0,5 % du CA HT) — réduction de ${formatPct(TAUX_REDUCTION_IS)}`,
          'middle'
        )
        : null;
      const stepExc = excedent
        ? stepExcedent(
          excedent,
          'Au-delà du plafond de mécénat — aucune réduction cette année, reportable sur 5 ans'
        )
        : null;

      const detail = isPoche
        ? [stepPlafond, bridgeIs, stepExc, stepDiv, bridgePfu].filter(Boolean)
        : [bridgePfu, stepDiv, bridgeIs, stepExc, stepPlafond].filter(Boolean);

      container.innerHTML = assembleFlow([stepResult, flowDivider(), ...detail, stepInput]);
    }

    function updateModeLabels(panel, mode) {
      const labels = LABELS[panel][mode];
      const labelEl = document.getElementById(`${panel}-montant-label`);
      const inputEl = document.getElementById(`${panel}-montant`);
      labelEl.textContent = labels.label;
      inputEl.placeholder = labels.placeholder;

      const hintEl = document.getElementById(`${panel}-montant-hint`);
      if (hintEl) {
        if (labels.hint) {
          hintEl.textContent = labels.hint;
          hintEl.hidden = false;
        } else {
          hintEl.textContent = '';
          hintEl.hidden = true;
        }
      }
    }

    function isRedevableIfi() {
      return document.getElementById('particulier-redevable-ifi').checked;
    }

    function updateIfiFields() {
      const isIfi = isRedevableIfi();
      document.getElementById('particulier-ifi-field').classList.toggle('hidden', !isIfi);

      const revenuLabel = document.getElementById('particulier-revenu-label');
      if (isIfi) {
        revenuLabel.innerHTML =
          'Revenu imposable annuel <span class="optional">(plafond IR sur le solde du don)</span>';
      } else {
        revenuLabel.innerHTML =
          'Revenu imposable annuel <span class="optional">(optionnel, pour le plafond)</span>';
      }
    }

    function setMode(panel, mode) {
      const state = panel === 'particulier' ? modeParticulier : modeMecenat;
      state.current = mode;

      document.querySelectorAll(`.mode-tab[data-panel="${panel}"]`).forEach((btn) => {
        const isActive = btn.dataset.mode === mode;
        btn.classList.toggle('active', isActive);
      });

      updateModeLabels(panel, mode);
      document.getElementById(`${panel}-montant`).value = '';

      if (panel === 'particulier') {
        updateParticulier();
      } else {
        updateMecenat();
      }
    }

    function setAlert(id, message) {
      const el = document.getElementById(id);
      if (!el) return;
      if (message) {
        el.textContent = message;
        el.classList.remove('hidden');
      } else {
        el.textContent = '';
        el.classList.add('hidden');
      }
    }

    function updateParticulier() {
      const montant = parseInput(document.getElementById('particulier-montant').value);
      const revenu = parseInput(document.getElementById('particulier-revenu').value);
      const ifiDu = parseInput(document.getElementById('particulier-ifi').value);
      const result = calculDonParticulier(
        montant,
        revenu,
        ifiDu,
        modeParticulier.current,
        isRedevableIfi() ? 'ifi' : 'ir'
      );

      renderParticulierFlow(result, modeParticulier.current);
      setAlert('particulier-alert', result ? result.messagePlafond : null);
    }

    function updateMecenat() {
      const montant = parseInput(document.getElementById('mecenat-montant').value);
      const caHT = parseInput(document.getElementById('mecenat-ca').value);
      const result = calculMecenat(montant, caHT, modeMecenat.current);

      renderMecenatFlow(result, modeMecenat.current);
      setAlert('mecenat-alert', result ? result.messagePlafond : null);
    }

    function initTabs() {
      const tabs = document.querySelectorAll('.tab');
      const panels = document.querySelectorAll('.panel');

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const target = tab.dataset.tab;

          tabs.forEach((t) => {
            const isActive = t === tab;
            t.classList.toggle('active', isActive);
            t.setAttribute('aria-selected', String(isActive));
          });

          panels.forEach((panel) => {
            const isActive = panel.id === `panel-${target}`;
            panel.classList.toggle('active', isActive);
            panel.hidden = !isActive;
          });
        });
      });
    }

    function initModeToggles() {
      document.querySelectorAll('.mode-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          setMode(btn.dataset.panel, btn.dataset.mode);
        });
      });
    }

    function initInputs() {
      ['particulier-montant', 'particulier-revenu', 'particulier-ifi'].forEach((id) => {
        document.getElementById(id).addEventListener('input', updateParticulier);
      });

      const ifiCheckbox = document.getElementById('particulier-redevable-ifi');
      ifiCheckbox.addEventListener('change', () => {
        updateIfiFields();
        updateParticulier();
      });

      ['mecenat-montant', 'mecenat-ca'].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener('input', updateMecenat);
        el.addEventListener('change', updateMecenat);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTabs();
      initModeToggles();
      initInputs();
      updateIfiFields();
      updateModeLabels('particulier', modeParticulier.current);
      updateModeLabels('mecenat', modeMecenat.current);
      updateParticulier();
      updateMecenat();
    });
  </script>
</body>
</html>
